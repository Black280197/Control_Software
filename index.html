<body style="text-align: center;padding: 200px;">
    <h1 style="color: red; font-size: 65px; margin-bottom: 100px;">Trang này đã bị chặn!</h1>
    <p>Hệ thống nhận diện máy tính: <b id="employeeName">Đang tải...</b> có thể đã truy cập trang web hoặc phần mềm không nằm trong danh mục cho phép!</p>
    <p>URL(APP) bị chặn: <b id="blockedUrl">Đang tải...</b></p>

    <script>
        // Hàm để lấy param từ URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Cập nhật nội dung khi trang load
        window.onload = function() {
            var employeeName = getUrlParameter('name') || 'Không xác định';
            var blockedUrl = getUrlParameter('url') || 'Không xác định';
            
            document.getElementById('employeeName').textContent = employeeName;
            document.getElementById('blockedUrl').textContent = blockedUrl;
        }
    </script>
